<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {{ data }}
    <table border="1">
       <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Salary</th>
        <th>Update</th>
        <th>Delete</th>
       </tr>
       {% for i in data %}
       <tr>
        <td>{{i.id}}</td>
        <td>{{i.name}}</td>
        <td>{{i.salary}}</td>
        <td><a href="/update/{{i.id}}">Update</a></td>
        <td><a href="/delete/{{i.id}}">Delete</a></td>
       </tr>
       {% endfor %}
    </table>
</body>
</html>
