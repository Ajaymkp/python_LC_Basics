<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {{ data }}
    <table border="1">
       <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Score</th>
        <th>Update</th>
        <th>Delete</th>
       </tr>
       {% for i in data %}
       <tr>
        <td>{{i[0]}}</td>
        <td>{{i[1]}}</td>
        <td>{{i[2]}}</td>
        <td><a href="/update/{{i[0]}}">Update</a></td>
        <td><a href="/delete/{{i[0]}}">Delete</a></td>
       </tr>
       {% endfor %}
    </table>
</body>
</html>
